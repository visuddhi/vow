<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Engagement</title>
<style>
  :root { --bg:#fbf7ee; --ink:#2b2418; --muted:#7a6d55; --gold:#b8913a; --line:#e8dcc0; --ok:#4f7a3a; --bad:#a3412f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 64px; }
  h1 { font-weight:normal; font-size:15px; letter-spacing:.35em; color:var(--gold); text-align:center; margin:4px 0 20px; }
  .cert { width:100%; display:block; border-radius:4px; box-shadow:0 10px 40px rgba(80,60,20,.12); background:#fff; }
  .card { margin-top:22px; padding:18px; border:1px solid var(--line); border-radius:10px; background:#fffdf8; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; font:inherit; font-size:22px; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); text-align:center; }
  button { width:100%; margin-top:12px; font:inherit; font-size:17px; padding:14px; border-radius:999px; border:0; background:var(--ink); color:#fbf7ee; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); font-size:14px; padding:10px; }
  button:disabled { opacity:.5; }
  .msg { font-size:14px; color:var(--muted); margin-top:12px; text-align:center; min-height:1em; word-break:break-word; }
  .msg.err { color:var(--bad); }
  dl { margin:0; font-size:13px; display:grid; grid-template-columns:auto 1fr; gap:8px 12px; }
  dt { color:var(--muted); }
  dd { margin:0; font-family: Menlo, Consolas, monospace; font-size:12px; word-break:break-all; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .verdict { font-size:18px; text-align:center; margin-bottom:14px; }
  a { color:var(--gold); }
  textarea { width:100%; font-family:Menlo,monospace; font-size:11px; height:80px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .hidden { display:none; }
  input.small, select { font-size:16px; text-align:left; padding:10px 12px; margin-bottom:12px; width:100%; font-family:inherit; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea.vow { font-family:inherit; font-size:15px; height:120px; }
</style>
</head>
<body>
<main>
  <h1>OUR ENGAGEMENT</h1>
  <img id="cert" class="cert" alt="certificate">

  <!-- shown when no contract in URL: deploy form for the proposer -->
  <section id="deployBox" class="card hidden">
    <div class="verdict">部署求婚合约</div>
    <label>网络</label>
    <select id="dChain">
      <option value="84532">Base Sepolia（测试网，免费演练）</option>
      <option value="8453">Base（正式）</option>
    </select>
    <label>她的钱包地址</label>
    <input id="dPartner" class="small" placeholder="0x…">
    <label>你的名字</label><input id="dMe" class="small" value="覃含章">
    <label>她的名字</label><input id="dHer" class="small" value="王瑶">
    <label>地点</label><input id="dPlace" class="small" value="Valle de Bravo, México">
    <label>誓词（每行一句，最多 5 行）</label>
    <textarea id="dVow" class="vow">Lake, sky and the two of us
虽非同生，但愿共死
No pedimos nacer el mismo día, pero sí morir el mismo día
Will you marry me?</textarea>
    <button id="btnDeploy">用当前钱包部署</button>
    <div id="dMsg" class="msg"></div>
    <div id="dDone" class="hidden">
      <label style="margin-top:14px">部署成功！这是你们的专属链接（请保存）：</label>
      <textarea id="dLink" readonly style="height:60px"></textarea>
      <button id="btnOpen">打开</button>
    </div>
  </section>

  <!-- shown before acceptance -->
  <section id="acceptBox" class="card hidden">
    <label for="reply">你的回答 · your answer</label>
    <input id="reply" value="我愿意" maxlength="40">
    <button id="btnAccept">在链上说「我愿意」</button>
    <button id="btnSign" class="ghost">没有信号？先签名（免费，可稍后提交）</button>
    <div id="sigBox" class="hidden">
      <label style="margin-top:12px">签名已保存。有信号后任何钱包都可以提交：</label>
      <textarea id="sigOut" readonly></textarea>
    </div>
    <button id="btnSubmitSig" class="ghost hidden">提交已保存的签名</button>
    <details style="margin-top:14px"><summary style="font-size:13px;color:var(--muted)">求婚者：更换她的钱包地址</summary>
      <input id="newPartner" class="small" placeholder="0x…" style="margin-top:8px">
      <button id="btnSetPartner" class="ghost">更换（需用你的钱包）</button>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">当前：<span id="curPartner"></span></div>
    </details>
    <div id="msg" class="msg"></div>
  </section>

  <!-- shown after acceptance -->
  <section id="verifyBox" class="card hidden">
    <div id="verdict" class="verdict"></div>
    <dl id="facts"></dl>
  </section>

  <div id="topmsg" class="msg"></div>
</main>

const DEPLOY_ABI = ["constructor(address partner_, string proposerName_, string partnerName_, string place_, string[] vow_)",
                    "function setPartner(address)"];
const q = new URLSearchParams(location.search);
const ADDR = q.get("c");
const CHAIN_ID = Number(q.get("chain") || 8453);
const CHAIN = CHAINS[CHAIN_ID];
const RPC = q.get("rpc") || CHAIN?.rpc || CHAINS[8453].rpc;
const $ = id => document.getElementById(id);
const SIG_KEY = `vow-sig-${CHAIN_ID}-${ADDR}`;
let PARTIES = null; // remembered while online so signing works with no signal
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

const ro = new ethers.JsonRpcProvider(RPC, CHAIN_ID, { staticNetwork: true });
const c = ADDR ? new ethers.Contract(ADDR, ABI, ro) : null;
const svgUrl = bytes => "data:image/svg+xml;base64," + ethers.encodeBase64(bytes);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };

async function load() {
  if (!c) { $("cert").classList.add("hidden"); $("deployBox").classList.remove("hidden"); return; }
  const acceptedAt = await c.acceptedAt();
  if (acceptedAt === 0n) {
    $("cert").src = svgUrl(await c.certificateSVG(2));
    PARTIES = { proposer: await c.proposer(), partner: await c.partner() };
    store.set(SIG_KEY + "-parties", JSON.stringify(PARTIES));
    $("acceptBox").classList.remove("hidden");
    $("curPartner").textContent = PARTIES.partner;
    const saved = store.get(SIG_KEY);
    if (saved) { showSig(saved); }
  } else {
    $("cert").src = svgUrl(await c.certificateSVG(2));
    $("acceptBox").classList.add("hidden");
    await verifyAll(acceptedAt);
  }
}

// Independently recompute every hash from the public data, in the browser.
async function verifyAll(acceptedAt) {
  const [proposer, partner, pName, qName, place, vow, pHash, reply, cHash, block, h1, h2] = await Promise.all([
    c.proposer(), c.partner(), c.proposerName(), c.partnerName(), c.place(), c.vow(),
    c.proposalHash(), c.reply(), c.certificateHash(), c.acceptedBlock(), c.ownerOf(1), c.ownerOf(2)]);
  const enc = ethers.AbiCoder.defaultAbiCoder();
  const k = s => ethers.keccak256(ethers.toUtf8Bytes(s));
  const vowHash = ethers.keccak256(ethers.concat(vow.map(k)));
  const myPHash = ethers.keccak256(enc.encode(
    ["uint256","address","address","address","bytes32","bytes32","bytes32","bytes32"],
    [CHAIN_ID, ADDR, proposer, partner, k(pName), k(qName), k(place), vowHash]));
  const myCHash = ethers.keccak256(enc.encode(["bytes32","bytes32","uint256"], [myPHash, k(reply), acceptedAt]));
  const onchainOk = await c.verify(myCHash);

  let tx = "";
  try {
    const logs = await c.queryFilter(c.filters.ProposalAccepted(), Number(block), Number(block));
    if (logs[0]) tx = logs[0].transactionHash;
  } catch {}

  const good = myPHash === pHash && myCHash === cHash && onchainOk && h1 === proposer && h2 === partner;
  $("verdict").innerHTML = good
    ? '<span class="ok">✓ 已在链上验证 · verified on-chain</span>'
    : '<span class="bad">✗ 校验未通过 · verification failed</span>';
  const ex = CHAIN.explorer;
  const link = (path, text) => ex ? `<a href="${ex}/${path}" target="_blank" rel="noopener">${text}</a>` : text;
  const when = new Date(Number(acceptedAt) * 1000).toLocaleString("zh-CN", { timeZone: "America/Mexico_City" });
  $("facts").innerHTML = `
    <dt>网络</dt><dd>${CHAIN.name} (${CHAIN_ID})</dd>
    <dt>合约</dt><dd>${link("address/" + ADDR, ADDR)}</dd>
    <dt>求婚者</dt><dd>${link("address/" + proposer, proposer)}</dd>
    <dt>签名回答者</dt><dd>${link("address/" + partner, partner)}</dd>
    <dt>回答</dt><dd>${reply.replace(/[<>&]/g, "")}</dd>
    <dt>时间</dt><dd>${when}（墨西哥城）· 区块 ${link("block/" + block, block)}</dd>
    ${tx ? `<dt>交易</dt><dd>${link("tx/" + tx, tx)}</dd>` : ""}
    <dt>证书哈希</dt><dd>${cHash} ${myCHash === cHash ? "✓" : "✗"}</dd>
    <dt>条款哈希</dt><dd>${pHash} ${myPHash === pHash ? "✓" : "✗"}</dd>`;
  $("verifyBox").classList.remove("hidden");
}

async function wallet(chainId = CHAIN_ID) {
  if (!window.ethereum) throw new Error("请在钱包 App（如 MetaMask）的内置浏览器里打开这个页面");
  const ch = CHAINS[chainId];
  const hex = "0x" + chainId.toString(16);
  await window.ethereum.request({ method: "eth_requestAccounts" });
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
  } catch (e) {
    if (e.code === 4902 || /unrecognized|not added|unknown chain/i.test(e.message || "")) {
      await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{
        chainId: hex, chainName: ch.name, rpcUrls: [ch.rpc], blockExplorerUrls: ch.explorer ? [ch.explorer] : [],
        nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 } }] });
    }
  }
  const bp = new ethers.BrowserProvider(window.ethereum);
  const signer = await bp.getSigner();
  if ((await bp.getNetwork()).chainId !== BigInt(chainId)) throw new Error(`请把钱包切换到 ${ch.name} 网络`);
  return signer;
}

$("btnDeploy").onclick = async () => {
  const dsay = (t, err) => { $("dMsg").textContent = t; $("dMsg").className = "msg" + (err ? " err" : ""); };
  $("btnDeploy").disabled = true;
  try {
    const chainId = Number($("dChain").value);
    const partner = $("dPartner").value.trim();
    if (!ethers.isAddress(partner)) throw new Error("她的钱包地址格式不对");
    const vow = $("dVow").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (vow.length > 5) throw new Error("誓词最多 5 行");
    const signer = await wallet(chainId);
    if ((await signer.getAddress()).toLowerCase() === partner.toLowerCase())
      throw new Error("当前钱包就是她的地址。请切换到你自己的账户再部署");
    dsay("请在钱包里确认部署…");
    const f = new ethers.ContractFactory(DEPLOY_ABI, BYTECODE, signer);
    const ct = await f.deploy(ethers.getAddress(partner), $("dMe").value.trim(), $("dHer").value.trim(), $("dPlace").value.trim(), vow);
    dsay("已发送，等待上链…（约几秒）");
    await ct.waitForDeployment();
    const addr = await ct.getAddress();
    const link = `${location.origin}${location.pathname}?c=${addr}` + (chainId === 8453 ? "" : `&chain=${chainId}`);
    $("dLink").value = link;
    $("dDone").classList.remove("hidden");
    $("btnOpen").onclick = () => { location.href = link; };
    dsay("");
  } catch (e) { dsay(e.shortMessage || e.message, true); }
  $("btnDeploy").disabled = false;
};

$("btnSetPartner").onclick = async () => {
  try {
    const np = $("newPartner").value.trim();
    if (!ethers.isAddress(np)) throw new Error("地址格式不对");
    const signer = await wallet();
    if ((await signer.getAddress()).toLowerCase() !== (await c.proposer()).toLowerCase())
      throw new Error("请切换到求婚者（部署合约的）钱包账户");
    say("请在钱包里确认…");
    await (await new ethers.Contract(ADDR, DEPLOY_ABI, signer).setPartner(ethers.getAddress(np))).wait();
    say("已更换 ✓");
    $("curPartner").textContent = ethers.getAddress(np);
  } catch (e) { say(e.shortMessage || e.message, true); }
};

$("btnAccept").onclick = async () => {
  const reply = $("reply").value.trim();
  if (!reply) return say("请写下你的回答", true);
  $("btnAccept").disabled = true;
  try {
    const signer = await wallet();
    const partner = await c.partner();
    if ((await signer.getAddress()).toLowerCase() !== partner.toLowerCase())
      throw new Error("这不是被求婚者的钱包");
    say("请在钱包里确认…");
    const tx = await c.connect(signer).accept(reply);
    say("已发送，等待上链…");
    await tx.wait();
    say("");
    await load();
  } catch (e) { say(e.shortMessage || e.message, true); }
  $("btnAccept").disabled = false;
};

$("btnSign").onclick = async () => {
  const reply = $("reply").value.trim();
  if (!reply) return say("请写下你的回答", true);
  try {
    if (!window.ethereum) throw new Error("请在钱包 App 的内置浏览器里打开这个页面");
    // signing needs no network: use whatever account is selected
    const signer = await new ethers.BrowserProvider(window.ethereum, "any").getSigner();
    if ((await signer.getAddress()).toLowerCase() !== PARTIES?.partner?.toLowerCase?.() && PARTIES)
      throw new Error("请切换到她的钱包账户再签名");
    let parties = PARTIES;
    if (!parties) { try { parties = JSON.parse(store.get(SIG_KEY + "-parties")); } catch {} }
    if (!parties) throw new Error("页面需要先在有信号时打开一次");
    const { proposer, partner } = parties;
    say("请在钱包里签名…");
    const sig = await signer.signTypedData(
      { name: "ProposalCertificate", version: "1", chainId: CHAIN_ID, verifyingContract: ADDR },
      { Accept: [{ name:"proposer", type:"address" }, { name:"partner", type:"address" }, { name:"reply", type:"string" }] },
      { proposer, partner, reply });
    const payload = JSON.stringify({ reply, sig });
    store.set(SIG_KEY, payload);
    showSig(payload);
    say("签名完成 ♥ 有信号后点「提交已保存的签名」");
  } catch (e) { say(e.shortMessage || e.message, true); }
};

function showSig(payload) {
  $("sigOut").value = payload;
  $("sigBox").classList.remove("hidden");
  $("btnSubmitSig").classList.remove("hidden");
}

$("btnSubmitSig").onclick = async () => {
  try {
    const { reply, sig } = JSON.parse($("sigOut").value);
    const signer = await wallet();
    say("请在钱包里确认提交…");
    const tx = await c.connect(signer).acceptWithSignature(reply, sig);
    say("已发送，等待上链…");
    await tx.wait();
    say("");
    await load();
  } catch (e) { say(e.shortMessage || e.message, true); }
};
$("sigOut").addEventListener("focus", () => $("sigOut").removeAttribute("readonly"));

Promise.race([load(), new Promise((_, rej) => setTimeout(() => rej(new Error("网络超时")), 8000))]).catch(e => {
  let cached = null; try { cached = JSON.parse(store.get(SIG_KEY + "-parties")); } catch {}
  if (cached && c) {
    PARTIES = cached; $("acceptBox").classList.remove("hidden"); $("curPartner").textContent = cached.partner;
    const saved = store.get(SIG_KEY); if (saved) showSig(saved);
    $("topmsg").textContent = "现在没有信号：可以先签名，有信号后再提交。";
  } else $("topmsg").textContent = "读取合约失败：" + (e.shortMessage || e.message);
});
</script>
